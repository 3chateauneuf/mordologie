<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mordologie — Reprendre / démarrer (aperçu 2a)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ac: #0d9488;
      --orange: #ec6913;
      --ink: #111827;
      --ink2: #374151;
      --muted: #6b7280;
      --muted2: #9ca3af;
      --line: rgba(0,0,0,0.08);
      --line-field: rgba(0,0,0,0.12);
      --bg: #f0f2f5;
      --card2: #fbfcfe;
      --chip: #eef1f6;
      --display: "Bricolage Grotesque", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: radial-gradient(ellipse at 80% 0%, rgba(13,148,136,0.05), transparent 55%), var(--bg);
      min-height: 100vh;
    }
    .page { width: 1240px; max-width: 100%; margin: 0 auto; padding: 40px; display: flex; flex-direction: column; gap: 16px; }
    @media (max-width: 900px) { .page { padding: 20px; } }

    /* ── Topbar ── */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; height: 58px; padding: 0 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
    .brand-logo span { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); }
    .brand-name { font-family: var(--display); font-size: 1.05rem; letter-spacing: -0.03em; }
    .topnav { display: flex; align-items: center; gap: 6px; }
    .nav-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--ink2); cursor: pointer; transition: border-color 150ms ease, background 150ms ease, color 150ms ease; }
    .nav-btn:hover { color: var(--ink); }
    .nav-btn.active { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 9%, #fff); color: var(--ac); }
    .nav-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
    .topbar-session { display: none; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ac) 24%, transparent); background: color-mix(in srgb, var(--ac) 8%, #fff); color: var(--ac); font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; }
    .topbar-session.on { display: inline-flex; }
    .topbar-session .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); animation: cap-pulse 1.6s ease-in-out infinite; }
    .avatar { width: 32px; height: 32px; border-radius: 9px; background: var(--orange); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.78rem; }

    /* ── Cards ── */
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .capture { gap: 13px; }

    /* ── Capture idle ── */
    .cap-row { display: flex; align-items: center; gap: 10px; }
    .cap-search { flex: 1; display: flex; align-items: center; gap: 11px; border: 1px solid var(--line-field); border-radius: 11px; padding: 0 15px; min-height: 54px; transition: border-color 150ms ease, box-shadow 150ms ease; }
    .cap-search:focus-within { border-color: var(--ac); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 14%, transparent); }
    .cap-search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: var(--display); font-size: 1.15rem; letter-spacing: -0.02em; color: var(--ink); padding: 0; }
    .btn-start { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 11px; border: none; background: var(--ac); color: #fff; font-family: var(--display); font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 150ms ease; }
    .btn-start:hover { background: #0f766e; }
    .btn-start:disabled { background: #e2e8f0; color: #94a3b8; cursor: default; }
    .cap-hint { font-size: 0.8rem; color: var(--muted2); }

    /* ── Context (comboboxes) ── */
    .cap-context { display: none; flex-direction: column; gap: 13px; padding-top: 13px; border-top: 1px solid rgba(0,0,0,0.06); }
    .cap-context.open { display: flex; }
    .cap-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { position: relative; display: flex; flex-direction: column; gap: 6px; }
    .field > label { font-size: 0.7rem; font-weight: 700; color: var(--muted); }
    .field .req { color: var(--ac); }
    .field .opt { color: var(--muted2); font-weight: 600; }
    .cap-input { width: 100%; box-sizing: border-box; border: 1px solid var(--line-field); border-radius: 9px; background: #fff; padding: 10px 12px; font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }
    .cap-input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 14%, transparent); }
    .tokenfield { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1px solid var(--line-field); border-radius: 9px; padding: 7px 10px; min-height: 44px; background: #fff; }
    .tokenfield input { flex: 1 1 120px; min-width: 100px; border: none; background: transparent; padding: 3px 2px; font-size: 0.86rem; outline: none; font-family: inherit; }
    .token { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); border: 1px solid rgba(0,0,0,0.07); border-radius: 6px; padding: 3px 4px 3px 9px; font-size: 0.8rem; font-weight: 600; color: var(--ink2); }
    .token button { width: 16px; height: 16px; border: none; background: rgba(0,0,0,0.06); border-radius: 50%; color: var(--muted2); font-size: 0.8rem; line-height: 1; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .combo-pop { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; z-index: 40; background: #fff; border: 1px solid var(--line-field); border-radius: 10px; padding: 5px; box-shadow: 0 10px 26px rgba(17,24,39,0.1); max-height: 210px; overflow-y: auto; }
    .combo-pop.hidden { display: none; }
    .qopt { display: flex; align-items: center; width: 100%; text-align: left; border: none; background: none; border-radius: 7px; padding: 8px 10px; font-size: 0.88rem; color: var(--ink); cursor: pointer; }
    .qopt:hover, .qopt.active { background: #f1f5f9; }
    .qopt.create { gap: 6px; color: var(--ac); font-weight: 700; font-size: 0.86rem; }

    /* ── Running card ── */
    .running { display: none; align-items: center; gap: 14px; flex-wrap: wrap; }
    .running.on { display: flex; }
    .run-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); flex: 0 0 auto; animation: cap-pulse 1.6s ease-in-out infinite; }
    .run-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .run-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
    .run-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .run-time { margin: 0 0 0 auto; font-family: var(--display); font-size: 2.4rem; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; color: var(--ac); }
    .btn-ghost { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-field); background: #fff; color: var(--ink2); font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-stop { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: var(--ink); color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

    /* Category pastille */
    .pastille { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 0.73rem; font-weight: 700; }

    /* ── Reprendre ── */
    .reprendre-head h2 { margin: 0; font-family: var(--display); font-size: 1.5rem; letter-spacing: -0.04em; }
    .reprendre-head p { margin: 3px 0 0; font-size: 0.84rem; color: var(--muted2); }
    .reprendre-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    @media (max-width: 900px) { .reprendre-grid { grid-template-columns: 1fr; } }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
    .col-head .lbl { font-size: 0.9rem; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
    .col-head .cnt { font-size: 0.7rem; font-weight: 700; color: var(--muted2); background: var(--chip); border-radius: 999px; padding: 1px 8px; }
    .qcard { display: flex; align-items: center; gap: 11px; text-align: left; width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--card2); border-radius: 11px; padding: 11px 12px; cursor: pointer; transition: border-color 140ms ease, background 140ms ease; }
    .qcard:hover { border-color: color-mix(in srgb, var(--ac) 40%, var(--line)); background: #fff; }
    .qplay-circle { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ac) 30%, #e2e8f0); background: color-mix(in srgb, var(--ac) 8%, #fff); display: inline-flex; align-items: center; justify-content: center; color: var(--ac); }
    .qcard-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
    .qcard-title { font-size: 0.88rem; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qcard-sub { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .qcard-sub .pastille { flex: 0 0 auto; padding: 1px 8px; font-size: 0.68rem; }
    .qcard-client { font-size: 0.74rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qcard-aside { font-size: 0.72rem; color: var(--muted2); }

    /* ── To-do ── */
    .todo-add { display: flex; gap: 6px; }
    .todo-add input { flex: 1; min-width: 0; box-sizing: border-box; border: 1px solid var(--line-field); border-radius: 8px; background: #fff; padding: 8px 10px; font-size: 0.84rem; outline: none; font-family: inherit; transition: border-color 150ms ease, box-shadow 150ms ease; }
    .todo-add input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 14%, transparent); }
    .todo-add button { flex: 0 0 auto; width: 34px; border-radius: 8px; border: 1px solid var(--line-field); background: var(--chip); color: var(--ink2); font-size: 1.05rem; font-weight: 700; cursor: pointer; line-height: 1; }
    .todo-list { display: flex; flex-direction: column; gap: 6px; }
    .todo-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 9px; transition: border-color 140ms ease, opacity 140ms ease; }
    .todo-row.dragover { border-color: var(--ac); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ac) 18%, transparent); }
    .todo-row.done { opacity: 0.6; }
    .todo-grip { flex: 0 0 auto; display: inline-flex; color: #c3c8cf; cursor: grab; }
    .todo-box { flex: 0 0 auto; width: 18px; height: 18px; border: 1px solid var(--line-field); border-radius: 5px; background: #fff; color: transparent; font-size: 0.7rem; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .todo-row.done .todo-box { background: var(--ac); border-color: var(--ac); color: #fff; }
    .todo-text { flex: 1; min-width: 0; font-size: 0.86rem; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .todo-row.done .todo-text { text-decoration: line-through; color: var(--muted2); }
    .todo-play { flex: 0 0 auto; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid color-mix(in srgb, var(--ac) 30%, #e2e8f0); background: color-mix(in srgb, var(--ac) 8%, #fff); color: var(--ac); border-radius: 7px; cursor: pointer; }
    .todo-arch { flex: 0 0 auto; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: none; background: none; color: var(--muted2); border-radius: 6px; cursor: pointer; }
    .todo-arch:hover { color: var(--ink2); background: #f1f5f9; }

    @keyframes cap-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .preview-tag { position: fixed; top: 10px; left: 10px; z-index: 50; font-family: var(--display); font-weight: 700; font-size: 0.7rem; letter-spacing: 0.04em; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  </style>
</head>
<body>
  <span class="preview-tag">2a · Aperçu (données fictives)</span>
  <div class="page">

    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo"><span></span></span>
        <strong class="brand-name">Mordologie</strong>
      </div>
      <nav class="topnav">
        <button class="nav-btn active" aria-label="Accueil"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V9.5L12 5l6 4.5V18"/><path d="M9.5 18v-4.5h5V18"/></svg></button>
        <button class="nav-btn" aria-label="Pilotage"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18h14"/><path d="M7 18V8"/><path d="M12 18V5"/><path d="M17 18v-6"/></svg></button>
        <button class="nav-btn" aria-label="Journal"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5.5h8.5A2.5 2.5 0 0 1 18 8v10.5H9A2 2 0 0 0 7 20.5Z"/><path d="M10 10h5"/><path d="M10 13.5h5"/></svg></button>
        <span class="nav-sep"></span>
        <button class="topbar-session" id="topSession"><span class="dot"></span><span id="topSessionTime">00:00:00</span></button>
        <span class="avatar">AM</span>
      </nav>
    </header>

    <!-- Capture -->
    <section class="card capture">
      <!-- idle -->
      <div id="idleBlock">
        <div class="cap-row">
          <label class="cap-search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9ca3af" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
            <input id="subject" type="text" placeholder="Sur quoi travaillez-vous ?" autocomplete="off" />
          </label>
          <button class="btn-start" id="startBtn" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 4.5l13 7.5-13 7.5V4.5z"/></svg>Démarrer</button>
        </div>
        <span class="cap-hint" id="capHint">Renseignez sujet, client et catégorie pour démarrer.</span>
        <div class="cap-context" id="capContext">
          <div class="cap-grid2">
            <div class="field">
              <label>Client <span class="req">· requis</span></label>
              <input class="cap-input" id="clientInput" type="text" autocomplete="off" placeholder="Chercher ou créer…" />
            </div>
            <div class="field">
              <label>Catégorie <span class="req">· requis</span></label>
              <input class="cap-input" id="catInput" type="text" autocomplete="off" placeholder="Chercher ou créer…" />
            </div>
          </div>
          <div class="field">
            <label>Tags <span class="opt">· optionnel</span></label>
            <div class="tokenfield" id="tagField">
              <input id="tagInput" type="text" autocomplete="off" placeholder="Chercher ou créer…" />
            </div>
          </div>
        </div>
      </div>

      <!-- running -->
      <div class="running" id="runningBlock">
        <span class="run-dot"></span>
        <div class="run-meta">
          <span class="run-title" id="runTitle">—</span>
          <div class="run-sub">
            <span class="pastille" id="runCat" data-cat="Design">Design</span>
            <span style="font-size:0.82rem;color:var(--muted);" id="runClient">Yumi</span>
          </div>
        </div>
        <p class="run-time" id="runTime">00:00:00</p>
        <button class="btn-ghost" id="adjustBtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 9.5-9.5a1.8 1.8 0 0 0 0-2.5l-.5-.5a1.8 1.8 0 0 0-2.5 0L5 16z"/></svg>Ajuster</button>
        <button class="btn-ghost" id="pauseBtn">Pause</button>
        <button class="btn-stop" id="stopBtn"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>Arrêter</button>
      </div>
    </section>

    <!-- Reprendre -->
    <section class="card">
      <div class="reprendre-head">
        <h2>Reprendre</h2>
        <p>Un clic relance la tâche avec tout son contexte.</p>
      </div>
      <div class="reprendre-grid">
        <div class="col" id="colRecent">
          <div class="col-head"><span class="lbl">Récentes</span><span class="cnt">6</span></div>
        </div>
        <div class="col" id="colFreq">
          <div class="col-head"><span class="lbl">Fréquentes</span><span class="cnt">4</span></div>
        </div>
        <div class="col">
          <div class="col-head"><span class="lbl">À faire</span><span class="cnt" id="todoCount">0</span></div>
          <div class="todo-add">
            <input id="todoInput" type="text" placeholder="Ajouter une tâche…" />
            <button id="todoAdd">＋</button>
          </div>
          <div class="todo-list" id="todoList"></div>
        </div>
      </div>
    </section>

  </div>

  <script>
    // ── Données fictives ──
    const CAT_COLORS = { Design:"#0d9488", Conseil:"#ec6913", "Développement":"#2f80c2", Facilitation:"#7c6bd6", Admin:"#64748b", Commercial:"#d4574e", Recherche:"#3f9142", Support:"#b8792a" };
    function catColor(c){ return CAT_COLORS[c] || "#64748b"; }
    function paint(el, c){ const col = catColor(c); el.style.background = `color-mix(in srgb, ${col} 16%, #fff)`; el.style.color = `color-mix(in srgb, ${col} 78%, #111827)`; el.style.border = `1px solid color-mix(in srgb, ${col} 28%, transparent)`; }

    const RECENT = [
      { title:"Refonte site Yumi", cat:"Design", client:"Yumi", aside:"il y a 40 min" },
      { title:"Audit ADEME", cat:"Conseil", client:"ADEME", aside:"il y a 2 h" },
      { title:"Synthèse compta", cat:"Admin", client:"Interne", aside:"hier" },
    ];
    const FREQ = [
      { title:"Refonte site Yumi", cat:"Design", client:"Yumi", aside:"14 sessions · 22 h" },
      { title:"Suivi ADEME", cat:"Conseil", client:"ADEME", aside:"9 sessions · 12 h 30" },
      { title:"Support client N2", cat:"Support", client:"Divers", aside:"7 sessions · 6 h" },
    ];

    function renderCol(el, items){
      items.forEach(it => {
        const b = document.createElement("button");
        b.className = "qcard";
        b.innerHTML = `
          <span class="qplay-circle"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.5l11 6.5-11 6.5V5.5z"/></svg></span>
          <span class="qcard-body">
            <span class="qcard-title">${it.title}</span>
            <span class="qcard-sub"><span class="pastille"></span><span class="qcard-client">${it.client}</span></span>
            <span class="qcard-aside">${it.aside}</span>
          </span>`;
        const p = b.querySelector(".pastille"); p.textContent = it.cat; paint(p, it.cat);
        b.onclick = () => startSession(it.title, it.client, it.cat);
        el.appendChild(b);
      });
    }
    renderCol(document.getElementById("colRecent"), RECENT);
    renderCol(document.getElementById("colFreq"), FREQ);

    // ── Capture / timer ──
    const subject = document.getElementById("subject");
    const clientInput = document.getElementById("clientInput");
    const catInput = document.getElementById("catInput");
    const startBtn = document.getElementById("startBtn");
    const capContext = document.getElementById("capContext");
    const capHint = document.getElementById("capHint");
    const idleBlock = document.getElementById("idleBlock");
    const runningBlock = document.getElementById("runningBlock");
    const topSession = document.getElementById("topSession");

    let timer = null, elapsed = 0, paused = false;

    function refreshStart(){
      const ok = subject.value.trim() && clientInput.value.trim() && catInput.value.trim();
      startBtn.disabled = !ok;
      capHint.textContent = ok ? "Prêt — Entrée pour démarrer." : "Renseignez sujet, client et catégorie pour démarrer.";
    }
    subject.addEventListener("focus", () => capContext.classList.add("open"));
    [subject, clientInput, catInput].forEach(i => i.addEventListener("input", refreshStart));
    subject.addEventListener("keydown", e => { if (e.key === "Enter" && !startBtn.disabled) start(); });
    startBtn.addEventListener("click", () => { if (!startBtn.disabled) start(); });

    function fmt(ms){ const s=Math.floor(ms/1000); return [s/3600,(s%3600)/60,s%60].map(n=>String(Math.floor(n)).padStart(2,"0")).join(":"); }
    function tick(){ if(!paused){ elapsed += 250; const t=fmt(elapsed); document.getElementById("runTime").textContent=t; document.getElementById("topSessionTime").textContent=t; } }

    function start(){ startSession(subject.value.trim(), clientInput.value.trim() || "Divers", catInput.value.trim() || "Admin"); }
    function startSession(title, client, cat){
      document.getElementById("runTitle").textContent = title;
      document.getElementById("runClient").textContent = client;
      const rc = document.getElementById("runCat"); rc.textContent = cat; paint(rc, cat);
      elapsed = 0; paused = false;
      idleBlock.style.display = "none";
      runningBlock.classList.add("on");
      topSession.classList.add("on");
      document.getElementById("pauseBtn").textContent = "Pause";
      clearInterval(timer); timer = setInterval(tick, 250);
    }
    document.getElementById("stopBtn").onclick = () => {
      clearInterval(timer); timer = null;
      runningBlock.classList.remove("on");
      topSession.classList.remove("on");
      idleBlock.style.display = "";
      subject.value = clientInput.value = catInput.value = "";
      capContext.classList.remove("open"); refreshStart();
    };
    document.getElementById("pauseBtn").onclick = () => {
      paused = !paused;
      document.getElementById("pauseBtn").textContent = paused ? "Reprendre" : "Pause";
    };
    topSession.onclick = () => document.getElementById("stopBtn").click();
    document.getElementById("adjustBtn").onclick = () => alert("Ajuster : rouvre le contexte pré-rempli (intégration app à venir).");

    // ── To-do ──
    let todos = [
      { id:1, text:"Relancer le devis Cargonautes", done:false },
      { id:2, text:"Préparer le support atelier", done:false },
      { id:3, text:"Répondre à Cyke", done:false },
    ];
    let seq = 4, dragId = null;
    const todoList = document.getElementById("todoList");
    const todoInput = document.getElementById("todoInput");

    function renderTodos(){
      const ordered = [...todos.filter(t=>!t.done), ...todos.filter(t=>t.done)];
      todoList.innerHTML = "";
      document.getElementById("todoCount").textContent = todos.filter(t=>!t.done).length;
      ordered.forEach(t => {
        const row = document.createElement("div");
        row.className = "todo-row" + (t.done ? " done" : "");
        row.draggable = true;
        row.innerHTML = `
          <span class="todo-grip" aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><circle cx="5" cy="4" r="1.3"/><circle cx="5" cy="8" r="1.3"/><circle cx="5" cy="12" r="1.3"/><circle cx="11" cy="4" r="1.3"/><circle cx="11" cy="8" r="1.3"/><circle cx="11" cy="12" r="1.3"/></svg></span>
          <button class="todo-box" aria-label="Marquer terminé">✓</button>
          <span class="todo-text">${t.text}</span>
          <button class="todo-play" title="Démarrer comme tâche"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M8 5.5l11 6.5-11 6.5V5.5z"/></svg></button>
          <button class="todo-arch" title="Archiver"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="4" rx="1"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M9.5 12.5h5"/></svg></button>`;
        row.querySelector(".todo-box").onclick = () => { t.done = !t.done; renderTodos(); };
        row.querySelector(".todo-play").onclick = () => { subject.value = t.text; subject.focus(); refreshStart(); };
        row.querySelector(".todo-arch").onclick = () => { todos = todos.filter(x => x.id !== t.id); renderTodos(); };
        row.ondragstart = () => { dragId = t.id; };
        row.ondragover = e => { e.preventDefault(); row.classList.add("dragover"); };
        row.ondragleave = () => row.classList.remove("dragover");
        row.ondrop = e => { e.preventDefault(); row.classList.remove("dragover");
          const from = todos.findIndex(x=>x.id===dragId), to = todos.findIndex(x=>x.id===t.id);
          if (from>-1 && to>-1 && from!==to){ const [m]=todos.splice(from,1); todos.splice(to,0,m); renderTodos(); } };
        todoList.appendChild(row);
      });
    }
    function addTodo(){ const v = todoInput.value.trim(); if(!v) return; todos.push({id:seq++, text:v, done:false}); todoInput.value=""; renderTodos(); }
    document.getElementById("todoAdd").onclick = addTodo;
    todoInput.addEventListener("keydown", e => { if (e.key === "Enter") addTodo(); });
    renderTodos();
    refreshStart();
  </script>
</body>
</html>
